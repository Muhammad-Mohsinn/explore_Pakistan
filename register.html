<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Pakistan | Book a Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/register.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Explore<span>Pakistan</span></a>
    <nav class="menu">
      <a href="index.html">Home</a>
      <a href="media.html">Gallery &amp; Info</a>
      <a class="current" href="register.html">Book a Tour</a>
    </nav>
  </header>

  <main class="box">
    <h1>Book Your Adventure</h1>
    <p class="intro">Tell us about your trip and we will send a custom itinerary within 24 hours.</p>

    <form id="bookingForm" action="#" method="post">
      <fieldset>
        <legend>Traveller Details</legend>
        <div class="field"><label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Mohsin Ali" minlength="3" maxlength="40" required></div>
        <div class="field"><label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required></div>
        <div class="field"><label for="pass">Password</label>
          <input type="password" id="pass" name="password" minlength="8" maxlength="20" placeholder="8 to 20 characters" required></div>
        <div class="field"><label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" min="1950-01-01" max="2010-12-31" required></div>
        <div class="field"><label for="site">Social / Website</label>
          <input type="url" id="site" name="site" placeholder="https://instagram.com/you"></div>
        <div class="field"><label for="country">Country</label>
          <input type="text" id="country" name="country" value="Pakistan" readonly></div>
        <div class="field full"><label for="photo">Passport / CNIC Copy</label>
          <input type="file" id="photo" name="photo" accept="image/*,.pdf"></div>
      </fieldset>

      <fieldset>
        <legend>Trip Preferences</legend>
        <div class="field"><label for="dest">Destination</label>
          <select id="dest" name="dest">
            <option>Hunza Valley</option>
            <option>Neelum Valley</option>
            <option selected>Swat Valley</option>
            <option>Lahore Heritage</option>
            <option>Mohenjo-daro</option>
            <option>Hingol &amp; Gwadar</option>
          </select></div>
        <div class="field"><label for="travellers">Travellers</label>
          <input type="number" id="travellers" name="travellers" min="1" max="20" value="2" required></div>
        <div class="field"><label for="time">Pickup Time</label>
          <input type="time" id="time" name="time" value="08:00"></div>
        <div class="field full"><label for="budget">Budget: PKR <output id="budgetOut">50,000</output></label>
          <input type="range" id="budget" name="budget" min="20000" max="200000" step="5000" value="50000"></div>
        <div class="field full"><span class="label">Travel Style</span>
          <label class="opt"><input type="radio" name="style" value="adventure" checked> Adventure</label>
          <label class="opt"><input type="radio" name="style" value="family"> Family</label>
          <label class="opt"><input type="radio" name="style" value="luxury"> Luxury</label></div>
        <div class="field full"><span class="label">Add-ons</span>
          <label class="opt"><input type="checkbox" name="addon" value="hotel" checked> Hotel</label>
          <label class="opt"><input type="checkbox" name="addon" value="guide"> Guide</label>
          <label class="opt"><input type="checkbox" name="addon" value="photo"> Photographer</label></div>
        <div class="field full"><label for="msg">Special Requests</label>
          <textarea id="msg" name="msg" rows="4" maxlength="250" placeholder="Anything we should know?"></textarea></div>
        <div class="field full"><label for="ref">Booking Reference</label>
          <input type="text" id="ref" name="ref" value="Assigned after submit" disabled></div>
      </fieldset>

      <button type="submit">Send Booking Request</button>
      <p id="status"></p>
    </form>
  </main>

  <script src="js/register.js"></script>
</body>
</html>
